<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="STARSIX MAP — Daftar map server.">
  <title>STARSIX MAP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <style>
    :root{
      --bg:#080809;--text:#f6f6f7;--muted:#96969f;
      --line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.15);
      --danger:#ff6868;--success:#72e3a2;--shadow:0 22px 70px rgba(0,0,0,.36);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;min-height:100vh;color:var(--text);
      background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.075),transparent 32%),var(--bg);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    .container{width:min(100% - 28px,1080px);margin:auto}

    .header{position:sticky;top:0;z-index:50;background:rgba(8,8,9,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .header-inner{height:66px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:800;letter-spacing:-.02em}
    .brand-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#f5f5f5;color:#111}
    .brand-mark svg{width:18px;height:18px}
    .icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;color:var(--text);background:rgba(255,255,255,.045);border:1px solid var(--line);transition:.22s ease}
    .icon-btn:hover{background:rgba(255,255,255,.09)}
    .icon-btn svg{width:17px;height:17px}
    #refreshBtn.loading svg{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    main{padding:34px 0 60px}
    .hero{text-align:center;padding:10px 0 26px}
    .eyebrow{color:#b9b9c0;text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:700;margin-bottom:12px}
    h1{font-size:clamp(30px,8vw,48px);line-height:1.05;letter-spacing:-.055em;margin:0}
    .hero p{max-width:560px;margin:14px auto 0;color:var(--muted);line-height:1.75;font-size:13px}

    .card{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:18px}
    .search-box{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;background:#0b0b0d;border:1px solid var(--line-strong);border-radius:14px;transition:.2s}
    .search-box:focus-within{border-color:rgba(255,255,255,.32);box-shadow:0 0 0 4px rgba(255,255,255,.04)}
    .search-box svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
    .search-box input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px;font-weight:600}
    .search-box input::placeholder{color:#5f5f67;font-weight:500}
    .filter-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .quick{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#d8d8dc;border-radius:12px;padding:10px 6px;font-size:11px;font-weight:600;transition:.2s}
    .quick:hover,.quick.active{background:rgba(255,255,255,.09);border-color:var(--line-strong);color:#fff}

    .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin:14px 2px 4px;font-size:10px;color:var(--muted)}
    .list-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}
    .section-title{font-size:14px;font-weight:750;letter-spacing:-.02em;margin:0}

    .map-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
    @media(min-width:700px){.map-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(min-width:1000px){.map-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .map-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 55px rgba(0,0,0,.20);transition:.22s ease}
    .map-card:hover{border-color:var(--line-strong);transform:translateY(-2px)}
    .map-thumb{position:relative;aspect-ratio:16/9;background:#0b0b0d;overflow:hidden;border-bottom:1px solid var(--line)}
    .map-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease}
    .map-thumb img.ready{opacity:1}
    .map-thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:#4a4a52}
    .map-thumb .ph svg{width:34px;height:34px}
    .map-card.loading .map-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.06) 50%,transparent 80%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
    @keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
    .badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:#c9c9ce;background:rgba(8,8,9,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .map-thumb .badge{position:absolute;left:10px;top:10px}
    .badge.unlocked{color:var(--success);border-color:rgba(114,227,162,.18)}
    .badge.locked{color:var(--danger);border-color:rgba(255,104,104,.2)}
    .badge svg{width:10px;height:10px}
    .online-pill{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:10px;font-weight:700;color:#e8e8ea;background:rgba(8,8,9,.62);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .online-pill i{width:7px;height:7px;border-radius:50%;background:#5f5f67}
    .online-pill.on i{background:var(--success);box-shadow:0 0 0 3px rgba(114,227,162,.18)}
    .map-body{padding:14px 14px 12px;display:grid;gap:12px}
    .map-title{display:flex;align-items:center;gap:11px;min-width:0}
    .map-icon{width:42px;height:42px;flex:0 0 42px;border-radius:13px;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .map-icon img{width:100%;height:100%;object-fit:cover}
    .map-icon svg{width:18px;height:18px;color:#8c8c94}
    .map-title>div{min-width:0}
    .map-name{font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .map-game{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .map-owner{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);min-width:0}
    .map-owner svg{width:13px;height:13px;flex:0 0 13px}
    .map-owner b{color:#d8d8dc;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .map-owner a{display:inline-flex;min-width:0}
    .map-owner a:hover b{text-decoration:underline}
    .map-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .map-stats div{padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
    .map-stats b{display:block;font-size:13px;font-weight:800;letter-spacing:-.03em}
    .map-stats span{display:block;margin-top:3px;font-size:8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    .join-btn{height:40px;border-radius:12px;border:0;background:#f3f3f3;color:#0a0a0b;font-size:10px;font-weight:800;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
    .join-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,255,255,.08)}
    .join-btn svg{width:14px;height:14px}
    .join-btn.off{background:rgba(255,255,255,.05);color:#77777f;border:1px solid var(--line);pointer-events:none}

    .pagination{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
    .pagination:empty{display:none}
    .page-btn{min-width:36px;height:36px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#d8d8dc;font-size:11px;font-weight:700;display:grid;place-items:center;transition:.2s}
    .page-btn svg{width:14px;height:14px}
    .page-btn:hover,.page-btn.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.34);color:#fff}
    .empty-state{grid-column:1/-1;text-align:center;padding:36px 12px;color:var(--muted)}
    .empty-state svg{width:34px;height:34px;opacity:.5;margin-bottom:10px}
    .empty-state p{margin:0;font-size:12px;line-height:1.6}
    .empty-state.err{color:var(--danger)}
    footer{text-align:center;padding:4px 0 34px;color:#64646c;font-size:10px}
    footer strong{color:#999;font-weight:700}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="Starsix Map">
        <span class="brand-mark"><i data-lucide="map-pin"></i></span>
        <span>STARSIX MAP</span>
      </a>
      <button class="icon-btn" id="refreshBtn" title="Muat ulang" aria-label="Muat ulang"><i data-lucide="refresh-cw"></i></button>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
        <div class="eyebrow">Daftar map</div>
        <h1>Pilih Map</h1>
        <p>Daftar map server beserta jumlah pemain online. Data diperbarui otomatis.</p>
      </section>

      <section class="card">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="searchInput" placeholder="Cari map..." autocomplete="off">
        </div>
        <div class="filter-row">
          <button class="quick active" data-filter="all">Semua</button>
          <button class="quick" data-filter="unlocked">Unlocked</button>
          <button class="quick" data-filter="locked">Locked</button>
        </div>
      </section>

      <div class="meta">
        <span id="statsText">Memuat data...</span>
        <span id="lastSync">Update terakhir: -</span>
      </div>

      <div class="list-head"><h2 class="section-title">Daftar Map</h2></div>
      <div class="map-grid" id="mapList"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer>
    <div class="container"><strong>STARSIX MAP</strong><br>Made with love and coffee.</div>
  </footer>

<script>
/* ==========================================================
   STARSIX MAP — Halaman publik (read-only)
   Tidak memakai token. Hanya membaca list_map.json.
   ISI SALAH SATU:
   - projectId (+ branch): repo GitLab harus PUBLIC
   - listUrl: URL JSON lain (mis. endpoint backend /api/maps)
   ========================================================== */
const CONFIG = {
  projectId: '84399704',          // contoh: '84399704'
  branch: 'main',
  listUrl: ''             // kosongkan jika memakai projectId
};
const LIST_FILE = 'list_map.json';
const ITEMS_PER_PAGE = 12;
const REFRESH_MS = 60 * 1000;

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const icons = () => { if (window.lucide) lucide.createIcons(); };
const esc = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let maps = [];
let currentPage = 1, currentFilter = 'all', currentSearch = '';
let lastListJson = '';
let loadedOnce = false;

function listUrl(){
  if (CONFIG.listUrl) return CONFIG.listUrl;
  return `https://gitlab.com/api/v4/projects/${encodeURIComponent(CONFIG.projectId)}/repository/files/${encodeURIComponent(LIST_FILE)}/raw?ref=${encodeURIComponent(CONFIG.branch || 'main')}`;
}

/* ── Daftar map ── */
async function loadList(){
  if (!CONFIG.listUrl && !CONFIG.projectId){
    showError('Halaman belum dikonfigurasi (isi projectId atau listUrl di bagian CONFIG).');
    return;
  }
  try {
    const res = await fetch(listUrl(), { cache: 'no-store', signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error(res.status === 404 || res.status === 401 ? 'Daftar map tidak ditemukan atau repository tidak publik.' : `HTTP ${res.status}`);
    const data = await res.json();
    const list = Array.isArray(data?.maps) ? data.maps : [];
    const clean = list
      .filter(m => m && typeof m.name === 'string')
      .map(m => ({ name: m.name, locked: m.locked === true, placeId: /^[1-9]\d{0,19}$/.test(String(m.placeId || '')) ? String(m.placeId) : '' }))
      .sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    const json = JSON.stringify(clean);
    const changed = json !== lastListJson;
    lastListJson = json;
    maps = clean;
    loadedOnce = true;
    $('#lastSync').textContent = `Update terakhir: ${new Date().toLocaleTimeString('id-ID')}`;
    updateStats();
    if (changed) renderList(); else hydrate(currentPageIds(), true);
  } catch (e) {
    if (!loadedOnce) showError(`Gagal memuat daftar map: ${e.message}`);
    else console.warn('Gagal menyegarkan daftar:', e);
  }
}

function showError(msg){
  $('#statsText').textContent = 'Gagal memuat data';
  $('#mapList').innerHTML = `<div class="empty-state err"><i data-lucide="alert-circle"></i><p>${esc(msg)}</p></div>`;
  $('#pagination').innerHTML = '';
  icons();
}

function updateStats(){
  const total = maps.length, locked = maps.filter(m => m.locked).length;
  $('#statsText').textContent = `Total: ${total} | Unlocked: ${total - locked} | Locked: ${locked}`;
}

function filtered(){
  let list = maps;
  if (currentFilter === 'unlocked') list = list.filter(m => !m.locked);
  else if (currentFilter === 'locked') list = list.filter(m => m.locked);
  if (currentSearch){
    const q = currentSearch.toLowerCase();
    list = list.filter(m => m.name.toLowerCase().includes(q) || m.placeId.includes(q) || (gameCache.get(m.placeId)?.data?.name || '').toLowerCase().includes(q));
  }
  return list;
}
function currentPageIds(){
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  return filtered().slice(start, start + ITEMS_PER_PAGE).map(m => m.placeId).filter(Boolean);
}

function renderList(){
  const list = filtered();
  const totalPages = Math.ceil(list.length / ITEMS_PER_PAGE);
  if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const page = list.slice(start, start + ITEMS_PER_PAGE);
  const box = $('#mapList');

  if (!page.length){
    box.innerHTML = '<div class="empty-state"><i data-lucide="map-pin"></i><p>Belum ada map</p></div>';
    $('#pagination').innerHTML = '';
    icons();
    return;
  }

  box.innerHTML = page.map(map => {
    const hasGame = !!map.placeId;
    return `
      <article class="map-card ${hasGame ? 'loading' : ''}" data-pid="${esc(map.placeId)}">
        <div class="map-thumb">
          <div class="ph"><i data-lucide="${hasGame ? 'image' : 'image-off'}"></i></div>
          <img class="thumb-img" alt="">
          <span class="badge ${map.locked ? 'locked' : 'unlocked'}"><i data-lucide="${map.locked ? 'lock' : 'lock-open'}"></i>${map.locked ? 'Locked' : 'Unlocked'}</span>
          <span class="online-pill ${hasGame ? '' : 'hidden'}"><i></i><span class="online-num">—</span> online</span>
        </div>
        <div class="map-body">
          <div class="map-title">
            <div class="map-icon"><img class="icon-img hidden" alt=""><i data-lucide="map-pin"></i></div>
            <div>
              <div class="map-name" title="${esc(map.name)}">${esc(map.name)}</div>
              <div class="map-game">${hasGame ? 'Memuat info game...' : 'Belum ada Game ID'}</div>
            </div>
          </div>
          <div class="map-owner"><i data-lucide="user"></i><span>Owner:</span><span class="owner-slot"><b>—</b></span></div>
          <div class="map-stats">
            <div><b class="st-online">—</b><span>Online</span></div>
            <div><b class="st-visits">—</b><span>Visits</span></div>
            <div><b class="st-fav">—</b><span>Favorit</span></div>
          </div>
          <a class="join-btn ${hasGame ? '' : 'off'}" ${hasGame ? `href="https://www.roblox.com/games/${esc(map.placeId)}/" target="_blank" rel="noopener noreferrer"` : ''}><i data-lucide="play"></i>JOIN GAME</a>
        </div>
      </article>`;
  }).join('');
  renderPagination(totalPages);
  icons();
  hydrate(page.map(m => m.placeId).filter(Boolean));
}

function renderPagination(totalPages){
  const box = $('#pagination');
  if (totalPages <= 1){ box.innerHTML = ''; return; }
  let html = '';
  if (currentPage > 1) html += `<button class="page-btn" data-page="${currentPage - 1}" aria-label="Sebelumnya"><i data-lucide="chevron-left"></i></button>`;
  const start = Math.max(1, currentPage - 2), end = Math.min(totalPages, start + 4);
  for (let i = start; i <= end; i++) html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
  if (currentPage < totalPages) html += `<button class="page-btn" data-page="${currentPage + 1}" aria-label="Berikutnya"><i data-lucide="chevron-right"></i></button>`;
  box.innerHTML = html;
}

/* ── Info game Roblox (proxy publik roproxy) ── */
const RBX = { apis: 'https://apis.roproxy.com', games: 'https://games.roproxy.com', thumbs: 'https://thumbnails.roproxy.com' };
const GAME_TTL_MS = 30 * 1000;
const gameCache = new Map();
let universeCache = {};
try { universeCache = JSON.parse(localStorage.getItem('pub_place_universe') || '{}') || {}; } catch { universeCache = {}; }

async function rbxGet(url){
  const res = await fetch(url, { signal: AbortSignal.timeout(12000), cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
const rbxOptional = (url) => rbxGet(url).catch(() => null);
function safeImage(url){
  try { const u = new URL(url); return u.protocol === 'https:' && (u.hostname === 'rbxcdn.com' || u.hostname.endsWith('.rbxcdn.com')) ? u.href : null; }
  catch { return null; }
}
async function resolveUniverse(placeId){
  if (universeCache[placeId]) return universeCache[placeId];
  const r = await rbxGet(`${RBX.apis}/universes/v1/places/${placeId}/universe`);
  const id = Number(r?.universeId);
  if (!Number.isSafeInteger(id) || id <= 0) throw new Error('notfound');
  universeCache[placeId] = id;
  try { localStorage.setItem('pub_place_universe', JSON.stringify(universeCache)); } catch {}
  return id;
}

async function fetchGameInfo(placeIds, force = false){
  const now = Date.now();
  const ids = [...new Set(placeIds)].filter(id => force || !gameCache.get(id) || now - gameCache.get(id).at > GAME_TTL_MS);
  if (!ids.length) return;
  const resolved = await Promise.allSettled(ids.map(resolveUniverse));
  const byUniverse = new Map();
  resolved.forEach((r, i) => {
    if (r.status === 'fulfilled') byUniverse.set(r.value, ids[i]);
    else gameCache.set(ids[i], { at: now, data: { error: /^(notfound|HTTP 404|HTTP 400)$/.test(r.reason?.message) ? 'notfound' : 'network' } });
  });
  const universes = [...byUniverse.keys()];
  for (let i = 0; i < universes.length; i += 50){
    const part = universes.slice(i, i + 50);
    const chunk = part.join(',');
    let details;
    try { details = await rbxGet(`${RBX.games}/v1/games?universeIds=${chunk}`); }
    catch { part.forEach(u => gameCache.set(byUniverse.get(u), { at: now, data: { error: 'network' } })); continue; }
    const [iconRes, thumbRes] = await Promise.all([
      rbxOptional(`${RBX.thumbs}/v1/games/icons?universeIds=${chunk}&size=256x256&format=Png&isCircular=false`),
      rbxOptional(`${RBX.thumbs}/v1/games/multiget/thumbnails?universeIds=${chunk}&countPerUniverse=1&defaults=true&size=768x432&format=Png&isCircular=false`)
    ]);
    part.forEach(u => {
      const placeId = byUniverse.get(u);
      const g = details?.data?.find(x => Number(x.id) === u);
      if (!g){ gameCache.set(placeId, { at: now, data: { error: 'notfound' } }); return; }
      const icon = safeImage(iconRes?.data?.find(x => Number(x.targetId) === u)?.imageUrl);
      const entry = thumbRes?.data?.find(x => Number(x.universeId || x.targetId) === u);
      const thumb = safeImage(entry?.thumbnails?.find(x => x.imageUrl)?.imageUrl || entry?.imageUrl);
      gameCache.set(placeId, { at: now, data: {
        rootPlaceId: String(g.rootPlaceId || placeId),
        name: g.name || 'Roblox game',
        playing: Number(g.playing) || 0,
        visits: Number(g.visits) || 0,
        favorites: Number(g.favoritedCount) || 0,
        owner: g.creator ? { id: Number(g.creator.id), name: g.creator.name, type: g.creator.type } : null,
        icon, thumb: thumb || icon
      }});
    });
  }
}

const numFull = (n) => Number(n).toLocaleString('id-ID');
const numShort = (n) => new Intl.NumberFormat('id-ID', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
function ownerHref(o){
  if (!o || !Number.isSafeInteger(o.id) || o.id <= 0) return null;
  return o.type === 'Group' ? `https://www.roblox.com/communities/${o.id}/` : `https://www.roblox.com/users/${o.id}/profile`;
}

function fillCard(card, info){
  card.classList.remove('loading');
  const set = (sel, text) => { const el = card.querySelector(sel); if (el) el.textContent = text; };
  if (!info || info.error){
    set('.map-game', info?.error === 'notfound' ? 'Game tidak ditemukan / tidak publik' : 'Info game tidak tersedia');
    card.querySelector('.online-pill')?.classList.add('hidden');
    return;
  }
  set('.map-game', info.name);
  set('.online-num', numFull(info.playing));
  set('.st-online', numFull(info.playing));
  set('.st-visits', numShort(info.visits));
  set('.st-fav', numShort(info.favorites));
  const pill = card.querySelector('.online-pill');
  pill?.classList.remove('hidden');
  pill?.classList.toggle('on', info.playing > 0);

  const slot = card.querySelector('.owner-slot');
  const href = ownerHref(info.owner);
  if (info.owner?.name){
    const b = document.createElement('b'); b.textContent = info.owner.name;
    if (href){
      const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.appendChild(b);
      slot.replaceChildren(a);
    } else slot.replaceChildren(b);
  }
  const join = card.querySelector('.join-btn');
  if (join && info.rootPlaceId) join.href = `https://www.roblox.com/games/${info.rootPlaceId}/`;

  const img = card.querySelector('.thumb-img');
  if (img && info.thumb && img.getAttribute('src') !== info.thumb){
    img.onload = () => { img.classList.add('ready'); card.querySelector('.ph')?.remove(); };
    img.alt = `Foto ${info.name}`;
    img.src = info.thumb;
  }
  const ic = card.querySelector('.icon-img');
  if (ic && info.icon && ic.getAttribute('src') !== info.icon){
    ic.onload = () => { ic.classList.remove('hidden'); ic.nextElementSibling?.classList.add('hidden'); };
    ic.src = info.icon;
  }
}

function paint(placeIds){
  placeIds.forEach(pid => {
    const cached = gameCache.get(pid);
    if (!cached) return;
    $$(`.map-card[data-pid="${CSS.escape(pid)}"]`).forEach(card => fillCard(card, cached.data));
  });
}

let hydrateToken = 0;
async function hydrate(placeIds, force = false){
  const ids = [...new Set(placeIds)];
  if (!ids.length) return;
  const token = ++hydrateToken;
  paint(ids);
  const btn = $('#refreshBtn'); btn.classList.add('loading');
  try { await fetchGameInfo(ids, force); } catch (e) { console.warn('Gagal memuat info game:', e); }
  if (token === hydrateToken) btn.classList.remove('loading');
  paint(ids);
}

/* ── Binding ── */
$('#refreshBtn').onclick = () => loadList();
$('#searchInput').addEventListener('input', (e) => { currentSearch = e.target.value.trim(); currentPage = 1; renderList(); });
$$('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
  $$('[data-filter]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  currentPage = 1;
  renderList();
}));
$('#pagination').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-page]');
  if (!btn) return;
  currentPage = Number(btn.dataset.page);
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('DOMContentLoaded', () => {
  icons();
  loadList();
  // auto refresh: daftar map + info game
  setInterval(() => { if (!document.hidden) loadList(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadList(); });
});
</script>
